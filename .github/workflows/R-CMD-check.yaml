# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # macOS-only: when the vendored ASan-instrumented libpdfium.dylib
      # is in inst/pdfium-binaries/, tune the ASan/UBSan runtime so the
      # test suite continues past the first detected error (we want to
      # see every bad write, not just the first), and so symbolicated
      # backtraces are produced. detect_leaks=0 because R's own GC
      # arena leaks intentionally; strict_init_order/detect_odr_violation=0
      # because base R packages share C++ static state that triggers
      # benign ODR overlap warnings drowning the real signal.
      ASAN_OPTIONS: ${{ matrix.config.os == 'macos-latest' && 'halt_on_error=0:detect_leaks=0:symbolize=1:symbolize_inlined_frames=1:strict_init_order=0:detect_odr_violation=0:abort_on_error=0:exitcode=0' || '' }}
      UBSAN_OPTIONS: ${{ matrix.config.os == 'macos-latest' && 'halt_on_error=0:print_stacktrace=1' || '' }}
      # macOS-only: enable libsystem_malloc's debug protections during
      # the test suite. Other matrix cells ignore these env vars. The
      # goal is to SIGSEGV at the moment a wild write happens (instead
      # of detecting it later when something reads the trampled slot),
      # so the .ips backtrace points at the writer, not the reader.
      #
      # The previous run with MallocCheckHeapEach=10 ran for 30+ min
      # without finishing — the per-malloc heap scan is O(heap size)
      # so every test slowed by O(N²). Dropped that and
      # MallocCheckHeapStart entirely; relying on guard-edges to
      # catch the boundary write at the moment it happens.
      MallocGuardEdges: '1'
      MallocErrorAbort: '1'
      MallocCorruptionAbort: '1'
      MallocScribble: '1'
      MallocPreScribble: '1'
      # (TESTTHAT_PARALLEL conditional was tested during #44 triage
      # and ruled out — both parallel and serial modes reproduce the
      # bug. The empty-string fallback also broke testthat on
      # ubuntu-latest oldrel-1 which strict-checks the var as
      # TRUE/FALSE only. Letting Config/testthat/parallel from
      # DESCRIPTION govern.)

    steps:
      - uses: actions/checkout@v6

      # When the vendored mac-arm64 binary is ASan-instrumented (the
      # #44 triage build), R must DYLD_INSERT_LIBRARIES the matching
      # libclang_rt.asan_osx_dynamic.dylib at process startup —
      # otherwise dlopen()ing pdfium.so emits:
      #   ERROR: Interceptors are not working. This may be because
      #   AddressSanitizer is loaded too late (e.g. via dlopen).
      # The runtime lives inside the .tgz; extract it to a stable
      # /tmp/ path here and export DYLD_INSERT_LIBRARIES via
      # GITHUB_ENV so the check-r-package step (and everything
      # downstream of it) sees the preload.
      - name: Preload libclang_rt.asan for R (macOS, ASan tgz only)
        if: runner.os == 'macOS'
        run: |
          set -e
          ARCHIVE="inst/pdfium-binaries/pdfium-mac-arm64.tgz"
          if [ ! -f "$ARCHIVE" ]; then
            echo "no vendored macOS PDFium .tgz; nothing to preload"
            exit 0
          fi
          # Probe the archive: is libpdfium.dylib ASan-instrumented?
          if ! tar -xzf "$ARCHIVE" -O lib/libpdfium.dylib 2>/dev/null \
                | strings 2>/dev/null | grep -q libclang_rt.asan; then
            echo "vendored libpdfium is not ASan-instrumented; skip preload"
            exit 0
          fi
          # Extract the bundled runtime to a stable path. Use /tmp/
          # rather than RUNNER_TEMP so the path stays valid for the
          # full job lifetime (RUNNER_TEMP may get nuked between
          # steps on some runner versions).
          mkdir -p /tmp/rpdfium-asan
          tar -xzf "$ARCHIVE" -C /tmp/rpdfium-asan \
            lib/libclang_rt.asan_osx_dynamic.dylib
          PRELOAD=/tmp/rpdfium-asan/lib/libclang_rt.asan_osx_dynamic.dylib
          ls -la "$PRELOAD"
          file "$PRELOAD"
          echo "DYLD_INSERT_LIBRARIES=$PRELOAD" >> "$GITHUB_ENV"
          echo "Preload path exported via GITHUB_ENV"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      # macOS-only, ASan triage only: re-codesign R's binary AND
      # the R wrapper script's shell so DYLD_INSERT_LIBRARIES is
      # honored.
      #
      # Iteration history:
      #   Run 26615795943: codesign --force --sign - --preserve-metadata
      #     dropped hardened runtime (flags 0x10000(runtime) → 0x2(adhoc))
      #     but R still saw empty DYLD_INSERT_LIBRARIES.
      #   Run 26616131326: added entitlements
      #     (allow-dyld-environment-variables + disable-library-validation
      #     + allow-unsigned-executable-memory). `codesign -d --entitlements -`
      #     confirms the entitlements WERE applied. R still sees empty.
      #     Both wrapper-invoked R AND direct exec/R show empty —
      #     meaning the strip happens BEFORE reaching R.
      #
      # Root cause: the workflow step's bash and the R wrapper's
      # /bin/sh are BOTH Apple-signed with hardened runtime + no
      # allow-dyld-environment-variables entitlement. Each call
      # through them prunes DYLD_*.
      #
      # Fix in this iteration:
      #   1. Diagnose where the strip happens by printenv at each
      #      layer (bash itself, direct exec/R, wrapper-invoked R).
      #   2. Copy /bin/sh to /tmp/rpdfium-asan/sh and re-sign it
      #      with the same entitlements so the R wrapper script's
      #      shebang chain stops stripping DYLD_*.
      #   3. Rewrite the R + Rscript wrapper script shebangs to
      #      use our resigned /tmp/-located sh.
      - name: Allow DYLD_INSERT_LIBRARIES on R (codesign + entitlements + wrapper injection)
        if: runner.os == 'macOS' && env.DYLD_INSERT_LIBRARIES != ''
        run: |
          set -e
          R_HOME_DIR="$(R RHOME)"
          R_BIN="$R_HOME_DIR/bin/exec/R"
          # NOTE: on macOS R, bin/Rscript is a Mach-O BINARY, not a
          # wrapper script (unlike bin/R). Previous attempt to sed
          # the shebang failed with "sed: RE error: illegal byte
          # sequence" because we tried to edit a binary as text.
          RSCRIPT_BIN="$R_HOME_DIR/bin/Rscript"
          R_WRAPPER="$R_HOME_DIR/bin/R"
          # PRELOAD must come from the Actions template, NOT from
          # bash's own env, because bash's dyld pruned
          # DYLD_INSERT_LIBRARIES at bash startup (bash is a
          # platform binary). Previous run wrote `export
          # DYLD_INSERT_LIBRARIES=""` to the wrapper because
          # $DYLD_INSERT_LIBRARIES expanded to the empty string.
          # ${{ env.DYLD_INSERT_LIBRARIES }} is evaluated by the
          # Actions runner BEFORE bash starts, so it embeds the
          # literal path.
          PRELOAD="${{ env.DYLD_INSERT_LIBRARIES }}"
          echo "PRELOAD resolved by Actions template: $PRELOAD"
          if [ -z "$PRELOAD" ]; then
            echo "::warning::PRELOAD empty; skipping codesign step"
            exit 0
          fi
          if [ ! -f "$R_BIN" ]; then
            echo "::warning::R binary not found at $R_BIN; skipping codesign rewrite"
            exit 0
          fi

          # Findings from run 26616407181 diagnostic:
          # - /bin/bash and /bin/sh both have flags=0x0(none) on
          #   macOS — NO hardened runtime — BUT they ARE platform
          #   binaries (Platform identifier=16). Platform binaries
          #   get DYLD_* pruned by dyld regardless of hardened
          #   runtime, because platform binaries are implicitly
          #   restricted. SIP forbids re-signing them in-place, so
          #   we copy /bin/sh to /tmp/ to escape SIP/platform-binary
          #   handling, then resign with allow-dyld-environment-vars.
          # - printenv from bash returns nothing because bash's
          #   dyld already pruned DYLD_INSERT_LIBRARIES at bash
          #   startup. We can NEVER get DYLD_* visible to bash
          #   via the workflow env block.
          # - Workaround: inject the env var INSIDE the R wrapper
          #   script — which is executed by our resigned /tmp/.../sh
          #   (entitled, so dyld doesn't prune), and the wrapper
          #   sets DYLD_INSERT_LIBRARIES via `export` before
          #   exec'ing bin/exec/R (also entitled).

          # Entitlements plist for adhoc resign.
          ENT=/tmp/rpdfium-asan/entitlements.plist
          mkdir -p /tmp/rpdfium-asan
          cat > "$ENT" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-dyld-environment-variables</key>
            <true/>
            <key>com.apple.security.cs.disable-library-validation</key>
            <true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
            <key>com.apple.security.cs.disable-executable-page-protection</key>
            <true/>
          </dict>
          </plist>
          PLIST

          # ==== Resign R + Rscript binaries with entitlements ====
          for bin in "$R_BIN" "$RSCRIPT_BIN"; do
            [ -f "$bin" ] || { echo "::warning::missing $bin"; continue; }
            echo ""
            echo "==== Resigning $bin ===="
            sudo codesign --remove-signature "$bin" || true
            sudo codesign --force --sign - --entitlements "$ENT" "$bin"
            codesign -dv "$bin" 2>&1 | head -5 || true
          done

          # ==== Wrapper shell: keep /bin/sh ====
          # Run 26617361512 tried to resign /tmp/rpdfium-asan/sh
          # but crashed at NULL because /bin/sh is arm64e
          # (pointer auth) while our chromium-built ASan dylib is
          # plain arm64 — dyld's preload-into-sh stage failed.
          #
          # Better approach: keep #!/bin/sh as the wrapper
          # shebang. /bin/sh is a platform binary so dyld prunes
          # DYLD_* at sh's own startup — sh does NOT load the
          # asan dylib (which would crash). Then our wrapper
          # injects `export DYLD_INSERT_LIBRARIES=...` inside the
          # script. That sets DYLD_* in sh's env. When sh exec's
          # bin/exec/R (which we resigned with the entitlement),
          # dyld honors DYLD_* for the child and inserts the
          # asan dylib into R. R is arm64 (not arm64e), matches
          # the asan dylib, loads cleanly.
          WRAPPER_SH=/bin/sh
          echo "Wrapper shell: $WRAPPER_SH"

          # ==== Patch bin/R wrapper ====
          # Two changes:
          # (a) shebang -> our resigned sh (entitled, dyld won't
          #     prune DYLD_*)
          # (b) inject `export DYLD_INSERT_LIBRARIES=...` after the
          #     shebang so the wrapper sets the preload before
          #     exec'ing bin/exec/R.
          # Reconstruct the file via cat'ing pieces (avoids fragile
          # BSD-sed multiline append syntax which broke YAML parse).
          echo ""
          echo "==== Patching $R_WRAPPER ===="
          echo "Before shebang: $(head -1 "$R_WRAPPER")"
          TMP_R_WRAPPER=$(mktemp)
          {
            echo "#!$WRAPPER_SH"
            echo "export DYLD_INSERT_LIBRARIES=\"$PRELOAD\""
            tail -n +2 "$R_WRAPPER"
          } > "$TMP_R_WRAPPER"
          sudo cp "$TMP_R_WRAPPER" "$R_WRAPPER"
          sudo chmod +x "$R_WRAPPER"
          rm "$TMP_R_WRAPPER"
          echo "After patch (first 5 lines):"
          head -5 "$R_WRAPPER"

          # ==== Replace bin/Rscript binary with a wrapper script ====
          # bin/Rscript is a standalone Mach-O binary that loads R's
          # library directly (not via the wrapper). We need DYLD_*
          # injected before it starts. Move the original aside,
          # write a wrapper script that exports DYLD_* and exec's
          # the original.
          echo ""
          echo "==== Wrapping $RSCRIPT_BIN ===="
          if [ ! -f "$RSCRIPT_BIN.orig" ]; then
            sudo mv "$RSCRIPT_BIN" "$RSCRIPT_BIN.orig"
            # The .orig must keep its entitlements (we already
            # resigned the path before this rename — but the rename
            # preserves the file so signature persists).
          fi
          sudo tee "$RSCRIPT_BIN" > /dev/null <<RSCRIPT_WRAP
          #!$WRAPPER_SH
          export DYLD_INSERT_LIBRARIES="$PRELOAD"
          exec "$RSCRIPT_BIN.orig" "\$@"
          RSCRIPT_WRAP
          sudo chmod +x "$RSCRIPT_BIN"
          echo "Wrapped Rscript content:"
          cat "$RSCRIPT_BIN"

          # ==== Smoke tests ====
          echo ""
          echo "==== Smoke test 1: R wrapper-injected preload ===="
          R --no-save --no-restore --vanilla -e \
            'cat("DYLD(R-wrap)=", Sys.getenv("DYLD_INSERT_LIBRARIES"), "\n", sep="")' \
            2>&1 | grep -E "DYLD\(R-wrap\)" || \
            echo "::warning::R-wrap smoke test did not run"

          echo "==== Smoke test 2: Rscript wrapper-injected preload ===="
          Rscript --vanilla -e \
            'cat("DYLD(Rscript-wrap)=", Sys.getenv("DYLD_INSERT_LIBRARIES"), "\n", sep="")' \
            2>&1 | grep -E "DYLD\(Rscript-wrap\)" || \
            echo "::warning::Rscript-wrap smoke test did not run"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # On macOS, when R CMD check segfaults the testthat traceback shows
      # the R-level call but not the C-level frame. This step picks up
      # the kernel's crash report from `~/Library/Logs/DiagnosticReports`,
      # extracts the faulting thread's frames, and runs `atos` against
      # our own binaries (pdfium.so + bundled libpdfium.dylib) to
      # symbolicate them. Output goes inline in the job log + as an
      # uploadable artifact. Linux + Windows have their own native paths
      # (core dumps / WinDbg) and are skipped here.
      - name: Capture macOS crash reports (on failure)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/macos-crashes"

          # The kernel writes the .ips report asynchronously; give it
          # a few seconds to land before we scan.
          files=""
          for i in 1 2 3 4 5; do
            sleep 2
            files=$(find "$HOME/Library/Logs/DiagnosticReports" \
                         /Library/Logs/DiagnosticReports \
                         -mmin -30 -type f \
                         \( -name "*.ips" -o -name "*.crash" \) \
                         2>/dev/null)
            [ -n "$files" ] && break
          done
          if [ -z "$files" ]; then
            echo "::warning::No macOS crash reports found in DiagnosticReports/ within 10s"
            exit 0
          fi

          # Find our installed binaries so atos has something to
          # symbolicate against. R CMD check installs into a tempdir
          # under check/pdfium.Rcheck/, NOT the user library, so
          # `system.file()` from a fresh Rscript returns empty. Fall
          # back to a glob.
          pkg_lib=$(Rscript -e 'cat(system.file("libs", package = "pdfium"))' 2>/dev/null)
          pkg_dylib=$(Rscript -e 'cat(system.file("lib", "libpdfium.dylib", package = "pdfium"))' 2>/dev/null)
          if [ -z "$pkg_lib" ] || [ ! -d "$pkg_lib" ]; then
            pkg_lib=$(find check -path '*/pdfium.Rcheck/pdfium/libs' -type d 2>/dev/null | head -1)
            echo "Falling back to check-dir install: pkg_lib=$pkg_lib"
          fi
          if [ -z "$pkg_dylib" ] || [ ! -f "$pkg_dylib" ]; then
            pkg_dylib=$(find check -path '*/pdfium.Rcheck/pdfium/lib/libpdfium.dylib' -type f 2>/dev/null | head -1)
            echo "Falling back to check-dir install: pkg_dylib=$pkg_dylib"
          fi
          echo "package shared object dir: $pkg_lib"
          echo "bundled libpdfium.dylib  : $pkg_dylib"
          echo ""

          for f in $files; do
            cp -v "$f" "$RUNNER_TEMP/macos-crashes/"
            echo ""
            echo "==== $f (full content) ===="
            cat "$f"
            echo "==== end $f ===="
            echo ""

            # .ips v2 is two JSON documents: a one-line header and a
            # multi-line body. Skip the header and feed the body to jq.
            body=$(tail -n +2 "$f")
            if [ -z "$body" ]; then
              echo "::warning::$f has no body, skipping symbolication"
              continue
            fi

            # Symbolicate the faulting thread using jq. macOS's .ips
            # bodies have JSON-ish syntax that strict Python json
            # rejects, but jq parses them. Apple's CrashReporter
            # already pre-symbolicates most frames (symbol + sourceFile
            # + sourceLine fields per frame), so we mostly just need
            # to pretty-print them. Falls back gracefully if jq isn't
            # happy.
            body=$(tail -n +2 "$f")
            if ! printf '%s' "$body" | jq '.faultingThread' >/dev/null 2>&1; then
              echo "::warning::jq could not parse .ips body — frames unavailable"
              continue
            fi
            faulting=$(printf '%s' "$body" | jq -r '.faultingThread // 0')
            echo "---- faulting thread #$faulting (Apple-symbolicated frames) ----"
            printf '%s' "$body" | jq -r --argjson ft "$faulting" '
              .usedImages as $imgs
              | .threads[$ft].frames
              | to_entries[]
              | "  #\(.key) "
                + (.value.symbol // "<unsym>")
                + " + " + ((.value.symbolLocation // 0) | tostring)
                + (if .value.sourceFile then
                     "  (" + .value.sourceFile + ":"
                     + ((.value.sourceLine // 0) | tostring) + ")"
                   else "" end)
                + "  [" + ($imgs[.value.imageIndex].name // "?")
                + "+0x" + ((.value.imageOffset // 0) | tostring) + "]"
            '
            echo ""
            echo ""
          done

      - name: Upload macOS crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.config.r }}-crashes
          path: ${{ runner.temp }}/macos-crashes/
          if-no-files-found: warn

      # Run the crashing reprex under lldb so SIGSEGV stops in the
      # debugger and we get a real C-level backtrace. The R-level
      # traceback from R CMD check above shows only the Rcpp shim
      # name (cpp_struct_tree_page); this step shows the frames
      # inside that shim — exactly where the bad write happened.
      #
      # Runs `if: failure() && runner.os == 'macOS'` so it only fires
      # when there's something to debug. Output is captured to the
      # job log + uploaded as an artifact for offline inspection.
      - name: Run struct-tree reprex under lldb (macOS, on failure)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/lldb-output"

          # R's actual binary lives at <R_HOME>/bin/exec/R and needs
          # R_HOME set in the environment — the wrapper shell script
          # at <R_HOME>/bin/R is what normally exports it. We export
          # R_HOME ourselves so lldb launches the binary cleanly.
          R_HOME_DIR="$(R RHOME)"
          R_BIN="$R_HOME_DIR/bin/exec/R"
          export R_HOME="$R_HOME_DIR"
          # R CMD check installs the package into check/pdfium.Rcheck/
          # rather than the user library; tell library() to look there.
          # Print diagnostics so if discovery fails we can see why.
          echo "::group::workspace discovery"
          echo "pwd        = $(pwd)"
          echo "GITHUB_WORKSPACE = $GITHUB_WORKSPACE"
          echo "ls .       :"
          ls -la 2>&1 | head -30
          echo "ls check/  :"
          ls -la check/ 2>&1 | head -10 || echo "  no check/ dir"
          if [ -d check/pdfium.Rcheck ]; then
            CHECK_LIBDIR="$(pwd)/check/pdfium.Rcheck"
          elif [ -d "$GITHUB_WORKSPACE/check/pdfium.Rcheck" ]; then
            CHECK_LIBDIR="$GITHUB_WORKSPACE/check/pdfium.Rcheck"
          else
            CHECK_LIBDIR=$(find / -name pdfium.Rcheck -type d 2>/dev/null | grep -v Library | head -1)
          fi
          if [ -n "$CHECK_LIBDIR" ] && [ -d "$CHECK_LIBDIR/pdfium" ]; then
            # Use R_LIBS (prepended to .libPaths()) instead of
            # R_LIBS_USER (which REPLACES the default user library).
            # Default R_LIBS_USER is /Users/runner/work/_temp/Library
            # where r-lib actions put Rcpp + dependencies; we need
            # both that and the check dir to be searched.
            export R_LIBS="$CHECK_LIBDIR"
            echo "R_LIBS prepended: $R_LIBS"
            echo "R_LIBS_USER (existing): $R_LIBS_USER"
            ls "$CHECK_LIBDIR" | head -10
            ls "$CHECK_LIBDIR/pdfium/libs/" 2>&1 | head -5 || true
            # Verify Rcpp is reachable so library(pdfium) works.
            echo "Rcpp present in R_LIBS_USER? $(test -d "$R_LIBS_USER/Rcpp" && echo yes || echo no)"
          else
            echo "::warning::pdfium.Rcheck not found — library(pdfium) will fail"
            echo "  fallback CHECK_LIBDIR='$CHECK_LIBDIR'"
          fi
          echo "::endgroup::"
          echo "R_HOME = $R_HOME_DIR"
          echo "R binary = $R_BIN"
          file "$R_BIN" || true
          # Confirm the reprex script is on disk where we expect.
          ls -la dev/reprex/macos-arm64-struct-tree.R

          # The "marker" lldb command writes a recognisable banner to
          # the session log without using `echo`, which isn't a valid
          # lldb builtin on the GitHub macos-latest runner's lldb
          # build. `script print(...)` runs through lldb's embedded
          # Python interpreter, which is always available.
          marker() {
            printf -- '-o\nscript print("=== %s ===")\n' "$1"
          }

          # lldb commands:
          #   1. follow-fork-mode child — testthat (and rcmdcheck)
          #      can fork Rscript children; we want lldb to follow
          #      whichever process actually segvs.
          #   2. process handle for SIGSEGV / SIGBUS / SIGABRT —
          #      stop in the debugger instead of letting R die.
          #   3. run the reprex; on stop, dump full diagnostics.
          # Mirror EXACTLY what R CMD BATCH does inside R CMD check:
          # cd to check/pdfium.Rcheck/tests, set LANGUAGE=C
          # R_TESTS=startup.Rs, then run R with the same flags
          # R CMD BATCH uses (--vanilla effectively + --no-readline)
          # and source testthat.R (which calls test_check). The
          # previous reprex that called test_check from interactive
          # Rscript PASSED, so this BATCH-mode mirror is the next
          # narrowing. If it crashes, env vars / BATCH-mode is
          # confirmed and lldb captures the C frame.
          TESTS_DIR="$(pwd)/check/pdfium.Rcheck/tests"
          if [ ! -d "$TESTS_DIR" ]; then
            echo "::warning::tests dir not found at $TESTS_DIR; falling back to reprex.R"
            INPUT_FILE="$(pwd)/dev/reprex/macos-arm64-struct-tree.R"
            cd "$(pwd)"
          else
            cd "$TESTS_DIR"
            INPUT_FILE="testthat.R"
            export LANGUAGE=C
            export R_TESTS=startup.Rs
            # Previously appended gctorture(TRUE) here. With ~3000
            # tests it pushed the lldb step to multi-hour runtime
            # without ever reproducing the bug. Removed; investigation
            # now happens locally using an ASan-instrumented R build
            # rather than CI's lldb step.
            echo "BATCH-mode mirror: pwd=$(pwd), LANGUAGE=$LANGUAGE, R_TESTS=$R_TESTS, input=$INPUT_FILE"
            ls -la startup.Rs testthat.R 2>&1 | head
          fi

          lldb --batch \
            -o "settings set target.process.follow-fork-mode child" \
            -o "settings set target.inherit-env true" \
            -o "process handle SIGSEGV --pass true --stop true --notify true" \
            -o "process handle SIGBUS  --pass true --stop true --notify true" \
            -o "process handle SIGABRT --pass true --stop true --notify true" \
            -o "script print('=== launching R (BATCH-mode mirror) ===')" \
            -o "run --no-save --no-restore --no-init-file --no-environ --no-readline -f $INPUT_FILE" \
            -o "script print('=== thread list ===')" \
            -o "thread list" \
            -o "script print('=== backtrace all threads ===')" \
            -o "thread backtrace all" \
            -o "script print('=== register state ===')" \
            -o "register read --all" \
            -o "script print('=== image holding pc ===')" \
            -o "image lookup --address \$pc" \
            -o "script print('=== disassembly around pc ===')" \
            -o "disassemble --pc --count 16" \
            -o "script print('=== image list (loaded binaries) ===')" \
            -o "image list" \
            -o "script print('=== memory near pc ===')" \
            -o "memory read --size 1 --count 128 \$pc - 32" \
            -o "quit" \
            -- "$R_BIN" \
            2>&1 | tee "$RUNNER_TEMP/lldb-output/lldb-bt.log"
          echo ""
          echo "==== lldb session complete; output saved to artifact ===="

      - name: Upload lldb output (macOS)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.config.r }}-lldb
          path: ${{ runner.temp }}/lldb-output/
          if-no-files-found: warn
