# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      # macOS R's grDevices/libs/cairo.so has a HARD load-time
      # dependency on /opt/X11/lib/libXrender.1.dylib (and
      # libSM/ICE/X11/Xext). Without XQuartz the dlopen of cairo.so
      # silently fails — and on macOS-arm64 R 4.6 the dlopen-failure
      # warning path corrupts the heap (root-caused by an unbounded
      # strcpy(buf, dlerror()) in R's src/unix/dynload.c, see
      # dev/upstream-patches/r-dlopen-dlerror-overflow.md for the
      # report-to-R-Core draft and the proposed patch). Until the
      # R-Core bug is fixed, install XQuartz so cairo.so loads cleanly
      # and the corruption-prone failure path is never entered.
      - name: Install XQuartz (macOS only)
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
