# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # On macOS, when R CMD check segfaults the testthat traceback shows
      # the R-level call but not the C-level frame. This step picks up
      # the kernel's crash report from `~/Library/Logs/DiagnosticReports`,
      # extracts the faulting thread's frames, and runs `atos` against
      # our own binaries (pdfium.so + bundled libpdfium.dylib) to
      # symbolicate them. Output goes inline in the job log + as an
      # uploadable artifact. Linux + Windows have their own native paths
      # (core dumps / WinDbg) and are skipped here.
      - name: Capture macOS crash reports (on failure)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/macos-crashes"

          # The kernel writes the .ips report asynchronously; give it
          # a few seconds to land before we scan.
          files=""
          for i in 1 2 3 4 5; do
            sleep 2
            files=$(find "$HOME/Library/Logs/DiagnosticReports" \
                         /Library/Logs/DiagnosticReports \
                         -mmin -30 -type f \
                         \( -name "*.ips" -o -name "*.crash" \) \
                         2>/dev/null)
            [ -n "$files" ] && break
          done
          if [ -z "$files" ]; then
            echo "::warning::No macOS crash reports found in DiagnosticReports/ within 10s"
            exit 0
          fi

          # Find our installed binaries so atos has something to
          # symbolicate against.
          pkg_lib=$(Rscript -e 'cat(system.file("libs", package = "pdfium"))' 2>/dev/null)
          pkg_dylib=$(Rscript -e 'cat(system.file("lib", "libpdfium.dylib", package = "pdfium"))' 2>/dev/null)
          echo "package shared object dir: $pkg_lib"
          echo "bundled libpdfium.dylib  : $pkg_dylib"
          echo ""

          for f in $files; do
            cp -v "$f" "$RUNNER_TEMP/macos-crashes/"
            echo ""
            echo "==== $f (full content) ===="
            cat "$f"
            echo "==== end $f ===="
            echo ""

            # .ips v2 is two JSON documents: a one-line header and a
            # multi-line body. Skip the header and feed the body to jq.
            body=$(tail -n +2 "$f")
            if [ -z "$body" ]; then
              echo "::warning::$f has no body, skipping symbolication"
              continue
            fi

            # Symbolicate the faulting thread, focusing on frames that
            # live in our binaries. apple-system frames get a name-only
            # entry; pdfium-related frames get the full atos lookup.
            python3 - "$f" "$pkg_lib" "$pkg_dylib" <<'PYEOF'
          import json, os, subprocess, sys
          ips_path, pkg_lib, pkg_dylib = sys.argv[1], sys.argv[2], sys.argv[3]
          our_binaries = []
          if pkg_lib:
              # pdfium.so lives at <pkg_lib>/pdfium.so on macOS.
              for cand in (os.path.join(pkg_lib, "pdfium.so"),
                           os.path.join(pkg_lib, "pdfium.dylib")):
                  if os.path.exists(cand):
                      our_binaries.append(cand)
          if pkg_dylib and os.path.exists(pkg_dylib):
              our_binaries.append(pkg_dylib)
          with open(ips_path) as fh:
              raw = fh.read()
          parts = raw.split("\n", 1)
          if len(parts) < 2:
              print("(no body to symbolicate)"); sys.exit(0)
          try:
              body = json.loads(parts[1])
          except Exception as e:
              print(f"(could not parse .ips body: {e})"); sys.exit(0)
          threads = body.get("threads", [])
          images = body.get("usedImages", [])
          fidx = body.get("faultingThread", 0)
          if fidx >= len(threads):
              print("(no faulting thread)"); sys.exit(0)
          frames = threads[fidx].get("frames", [])
          print(f"---- symbolicated faulting thread #{fidx} ({len(frames)} frames) ----")
          for n, fr in enumerate(frames):
              imi = fr.get("imageIndex", -1)
              off = fr.get("imageOffset", 0)
              if imi < 0 or imi >= len(images):
                  print(f"  #{n:02d} <unknown image>")
                  continue
              img = images[imi]
              path = img.get("path", "")
              base = img.get("base", 0)
              name = os.path.basename(path) or "<unknown>"
              is_ours = (
                  any(os.path.realpath(path) == os.path.realpath(b)
                      for b in our_binaries)
                  or "pdfium" in name
              )
              if is_ours and os.path.exists(path):
                  try:
                      out = subprocess.check_output(
                          ["atos", "-arch", "arm64", "-o", path,
                           "-l", hex(base), hex(base + off)],
                          stderr=subprocess.STDOUT, timeout=10
                      ).decode().strip()
                      print(f"  #{n:02d} {out}  [{name}+0x{off:x}]")
                      continue
                  except Exception as e:
                      pass
              print(f"  #{n:02d} {name}+0x{off:x}")
          PYEOF
            echo ""
          done

      - name: Upload macOS crash reports
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.config.r }}-crashes
          path: ${{ runner.temp }}/macos-crashes/
          if-no-files-found: warn

      # Run the crashing reprex under lldb so SIGSEGV stops in the
      # debugger and we get a real C-level backtrace. The R-level
      # traceback from R CMD check above shows only the Rcpp shim
      # name (cpp_struct_tree_page); this step shows the frames
      # inside that shim — exactly where the bad write happened.
      #
      # Runs `if: failure() && runner.os == 'macOS'` so it only fires
      # when there's something to debug. Output is captured to the
      # job log + uploaded as an artifact for offline inspection.
      - name: Run struct-tree reprex under lldb (macOS, on failure)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/lldb-output"
          R_BIN="$(Rscript -e 'cat(file.path(R.home("bin"), "exec", "R"))')"
          echo "R binary: $R_BIN"
          file "$R_BIN" || true

          # lldb commands:
          #   1. Have lldb intercept SIGSEGV / SIGBUS / SIGABRT so
          #      they stop in the debugger instead of killing R.
          #   2. `settings set target.process.follow-fork-mode child`
          #      — testthat (and rcmdcheck) fork Rscript children;
          #      we want to follow whichever process actually segvs.
          #   3. Run R with the reprex script.
          #   4. On stop, dump full diagnostic info: bt all, register
          #      state, instruction at $pc, neighborhood of the
          #      faulting address.
          lldb --batch \
            -o "settings set target.process.follow-fork-mode child" \
            -o "process handle SIGSEGV --pass true --stop true --notify true" \
            -o "process handle SIGBUS  --pass true --stop true --notify true" \
            -o "process handle SIGABRT --pass true --stop true --notify true" \
            -o "run --no-save --no-restore --vanilla -f dev/reprex/macos-arm64-struct-tree.R" \
            -o "echo === thread list ===" \
            -o "thread list" \
            -o "echo === backtrace all threads ===" \
            -o "thread backtrace all" \
            -o "echo === register state ===" \
            -o "register read --all" \
            -o "echo === image holding pc ===" \
            -o "image lookup --address \$pc" \
            -o "echo === disassembly around pc ===" \
            -o "disassemble --pc --count 16" \
            -o "echo === image list (loaded binaries) ===" \
            -o "image list" \
            -o "echo === memory near pc ===" \
            -o "memory read --size 1 --count 128 \$pc - 32" \
            -o "quit" \
            -- "$R_BIN" \
            2>&1 | tee "$RUNNER_TEMP/lldb-output/lldb-bt.log"
          echo ""
          echo "==== lldb session complete; output saved to artifact ===="

      - name: Upload lldb output (macOS)
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.config.r }}-lldb
          path: ${{ runner.temp }}/lldb-output/
          if-no-files-found: warn
